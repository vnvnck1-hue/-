        const getEnemiesInLine = (startX, startY, angle, width, length, enemies) => {

        const getConeCells = (unit, targetX, targetY, length = 360, coneAngle = Math.PI / 7) => {
            const sx = unit.x * CELL + CELL / 2, sy = unit.y * CELL + CELL / 2;
            const aim = Math.atan2(targetY - sy, targetX - sx);

            for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++) {

                const d = pixelDist(sx, sy, cx, cy);
                if (d > length || d < 8) continue;

                if (Math.abs(angleDiff(a, aim)) <= coneAngle / 2) cells.push({ x, y });

        const isInCone = (unit, targetX, targetY, obj, length = 360, coneAngle = Math.PI / 7) => {
            const sx = unit.x * CELL + CELL / 2, sy = unit.y * CELL + CELL / 2;
            const aim = Math.atan2(targetY - sy, targetX - sx);
            const ox = obj.x * CELL + CELL / 2, oy = obj.y * CELL + CELL / 2;
            const d = pixelDist(sx, sy, ox, oy);
            if (d > length || d < 8) return false;
            const a = Math.atan2(oy - sy, ox - sx);
            return Math.abs(angleDiff(a, aim)) <= coneAngle / 2;
        };
        const getGridLineCells = (unit, targetX, targetY) => {
            const sx = unit.x * CELL + CELL / 2, sy = unit.y * CELL + CELL / 2;
            const dx = targetX - sx, dy = targetY - sy;
            let stepX = 0, stepY = 0;
            if (Math.abs(dx) > Math.abs(dy) * 1.6) stepX = dx >= 0 ? 1 : -1;
            else if (Math.abs(dy) > Math.abs(dx) * 1.6) stepY = dy >= 0 ? 1 : -1;
            else { stepX = dx >= 0 ? 1 : -1; stepY = dy >= 0 ? 1 : -1; }
            const cells = [];
            let x = unit.x + stepX, y = unit.y + stepY;

            const seen = new Set();

                                    {TALENT_TREE_NODES.flatMap(node => (node.prereq || []).map(parentId => {
                                        const parent = nodeMap[parentId];
                                        if (!parent) return null;
                                        const bought = getTalentLevel(tree, node.id) > 0;
                                        const ready = unlocked(node);
                                        const color = bought ? TALENT_BRANCH_META[node.branch].color : ready ? '#94a3b8' : '#334155';
                                        return <line key={`${parentId}-${node.id}`} x1={parent.x} y1={parent.y} x2={node.x} y2={node.y} stroke={color} strokeWidth={bought ? 5 : 3} opacity={bought ? 0.9 : ready ? 0.55 : 0.28} filter={bought ? 'url(#treeGlow)' : 'none'} />;
                                    }))}
                                </svg>
                                {TALENT_TREE_NODES.map(node => {
                                    const lv = getTalentLevel(tree, node.id);
                                    const meta = TALENT_BRANCH_META[node.branch];
                                    const isMax = lv >= node.max;
                                    const isUnlocked = unlocked(node);
                                    const buyable = canBuy(node);
                                    const cost = node.costs[lv] || 0;
                                    const locked = !isUnlocked;
                                    const size = node.id === 'root' || node.id === 'timeCore' || node.id.endsWith('Final') ? 72 : 58;
                                    return <button key={node.id} onClick={() => { if (buyable && !isMax) onBuy(node.id); }} aria-disabled={!buyable || isMax} onMouseEnter={() => setHoveredTalent(node.id)} onMouseLeave={() => setHoveredTalent(null)} style={{ position:'absolute', left:node.x - size/2, top:node.y - size/2, width:size, height:size, borderRadius:'50%', border:`3px solid ${isMax ? meta.color : buyable ? '#fff' : locked ? '#475569' : meta.color}`, background: isMax ? `radial-gradient(circle, ${meta.color}, #0f172a 72%)` : buyable ? `radial-gradient(circle, #fff 0%, ${meta.color} 42%, #0f172a 78%)` : locked ? 'radial-gradient(circle, #334155, #020617)' : `radial-gradient(circle, ${meta.bg}, #0f172a 75%)`, color:'#fff', cursor: buyable && !isMax ? 'pointer' : 'default', opacity: locked ? 0.45 : 1, boxShadow: purchasedNodeId === node.id ? `0 0 42px #fff, 0 0 34px ${meta.color}` : isMax ? `0 0 20px ${meta.color}` : buyable ? `0 0 24px ${meta.color}, 0 0 8px #fff` : `0 0 8px ${meta.color}55`, zIndex:hoveredTalent === node.id ? 6 : 2, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:0, transition:'transform .12s, box-shadow .18s', transform:hoveredTalent === node.id ? 'scale(1.08)' : 'scale(1)', animation: purchasedNodeId === node.id ? 'talentUnlockPop .7s ease-out' : buyable ? 'tutGlowYellow 1.1s ease-in-out infinite' : 'none' }}>
                                        {purchasedNodeId === node.id && <>
                                            <div style={{ position:'absolute', inset:-16, borderRadius:'50%', border:`3px solid ${meta.color}`, animation:'talentUnlockRing .75s ease-out', pointerEvents:'none' }} />
                                            <div style={{ position:'absolute', inset:-24, borderRadius:'50%', background:`radial-gradient(circle, ${meta.color}66 0%, transparent 68%)`, animation:'talentUnlockFlash .65s ease-out', pointerEvents:'none' }} />
                                            <div style={{ position:'absolute', top:-22, left:'50%', transform:'translateX(-50%)', fontSize:18, animation:'talentSparkRise .7s ease-out', pointerEvents:'none' }}>✦</div>
                                        </>}
                                        <div style={{ fontSize:size > 60 ? 24 : 20, lineHeight:1 }}>{locked ? '🔒' : node.icon}</div>
                                        <div style={{ fontSize:8, color:isMax ? '#fff' : '#cbd5e1', marginTop:3 }}>{lv}/{node.max}</div>
                                        {!isMax && !locked && <div style={{ position:'absolute', bottom:-17, left:'50%', transform:'translateX(-50%)', fontSize:9, padding:'2px 6px', borderRadius:999, background: crystals >= cost ? 'rgba(59,130,246,0.92)' : 'rgba(127,29,29,0.92)', border:'1px solid rgba(255,255,255,0.22)', whiteSpace:'nowrap' }}>🔷 {cost}</div>}
                                    </button>;
                                })}
                                {hoveredTalent && (() => {
                                    const node = nodeMap[hoveredTalent];
                                    if (!node) return null;
                                    const meta = TALENT_BRANCH_META[node.branch];
                                    const lv = getTalentLevel(tree, node.id);
                                    const isMax = lv >= node.max;
                                    const isUnlocked = unlocked(node);
                                    const cost = node.costs[lv] || 0;
                                    const left = Math.max(12, Math.min(900 - 258, node.x + 46));
                                    const top = Math.max(12, Math.min(805 - 142, node.y - 48));
                                    return <div style={{ position:'absolute', left, top, width:246, padding:'12px 13px', borderRadius:12, background:'rgba(2,6,23,0.96)', border:`1px solid ${meta.color}aa`, boxShadow:`0 12px 34px rgba(0,0,0,0.55), 0 0 20px ${meta.color}44`, zIndex:20, pointerEvents:'none' }}>
                                        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:7 }}>
                                            <div style={{ width:30, height:30, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', background:meta.bg, border:`1px solid ${meta.color}`, fontSize:17 }}>{isUnlocked ? node.icon : '🔒'}</div>
                                            <div>
                                                <div style={{ fontSize:13, fontWeight:900, color:'#fff' }}>{node.name}</div>
                                                <div style={{ fontSize:10, color:meta.color, fontWeight:800 }}>{meta.name} · Lv {lv}/{node.max}</div>
                                            </div>
                                        </div>
                                        <div style={{ fontSize:11, lineHeight:1.45, color:'#dbeafe', marginBottom:8 }}>{node.desc}</div>
                                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:10, color:'#cbd5e1' }}>
                                            <span>{isMax ? '최대 레벨' : isUnlocked ? '다음 강화 비용' : '선행 특성 필요'}</span>
                                            <b style={{ color:isMax ? '#facc15' : crystals >= cost && isUnlocked ? '#93c5fd' : '#fca5a5' }}>{isMax ? '완료' : isUnlocked ? `🔷 ${cost}` : '잠김'}</b>
                                        </div>
                                    </div>;
                                })()}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* =========================================================
           4. MAIN GAME COMPONENT
           상태, 전투 루프, 입력 처리, 화면 렌더링을 포함하는 단일 진입점
        ========================================================= */

        function GridDefenseGame() {
            // --- 4-1. React state: 전투/경제/상점/튜토리얼 화면 상태 ---
            const [talentTree, setTalentTree] = useState(readPermanentTalentTree);
            const [timeCrystals, setTimeCrystals] = useState(readTimeCrystals);
            const [showTalentTree, setShowTalentTree] = useState(false);
            const [lastPurchasedTalent, setLastPurchasedTalent] = useState(null);
            const [units, setUnits] = useState(() => createInitialUnitsWithTalents(talentTree));
            const [enemies, setEnemies] = useState([]);
            const [effects, setEffects] = useState([]);
            const [, setAnimationFrameTick] = useState(0);
            const [wave, setWave] = useState(1);
            const [phase, setPhase] = useState('placement');
            const [gameOver, setGameOver] = useState(false);
            const [selectedUnit, setSelectedUnit] = useState(null);
            const [dragging, setDragging] = useState(null);
            const [dragPos, setDragPos] = useState({ x: 0, y: 0 });
            const [ghostPos, setGhostPos] = useState(null);
            const [shake, setShake] = useState(false);
            const [startPositions, setStartPositions] = useState({});
            const [gold, setGold] = useState(() => getTalentEffects(talentTree).startGold || 0);
            const [droppedGold, setDroppedGold] = useState([]);
            const [collectingGold, setCollectingGold] = useState(false);
            const [currentGimmick, setCurrentGimmick] = useState(null);
            const [hydraDeaths, setHydraDeaths] = useState({});
            const [isIllusionistDead, setIsIllusionistDead] = useState(false);
            const [gimmickMessage, setGimmickMessage] = useState(null);
            const [ultCastingUnitId, setUltCastingUnitId] = useState(null);
            const [ultMode, setUltMode] = useState(null);
            const [ultTarget, setUltTarget] = useState({ x: 0, y: 0 });
            const [slowMotion, setSlowMotion] = useState(false);
            const [chainLightningPos, setChainLightningPos] = useState(null);
            const [inventory, setInventory] = useState(() => {
                const eff = getTalentEffects(talentTree);
                const permanentRelics = makePermanentLegendaryRelicEntries();
                if (eff.starterItem) {
                    const firstTier = Object.values(ITEM_TIERS).map(arr => arr[0]);
                    return [makeInventoryEntry(firstTier[Math.floor(Math.random() * firstTier.length)]), ...permanentRelics];
                }
                return permanentRelics;
            });
            const [inventoryCapacity, setInventoryCapacity] = useState(MAX_INVENTORY);
            const [draggingItem, setDraggingItem] = useState(null);
            const [itemDragPos, setItemDragPos] = useState({ x: 0, y: 0 });
            const [perks, setPerks] = useState([]);
            const [perkSelection, setPerkSelection] = useState(null);
            const [perkRerollCost, setPerkRerollCost] = useState(500);
            const [mergeEffect, setMergeEffect] = useState(null);
            const [subWave, setSubWave] = useState(0);
            const [maxSubWaves, setMaxSubWaves] = useState(1);
            const [sellMode, setSellMode] = useState(false);
            const [merchant, setMerchant] = useState(null);
            const [deadUnits, setDeadUnits] = useState([]);
            const [tutorialStep, setTutorialStep] = useState(1);
            const [tutorialMovedUnitIds, setTutorialMovedUnitIds] = useState([]);
            const [tutorialPending3, setTutorialPending3] = useState(false);
            const [tutorialPending5, setTutorialPending5] = useState(false);
            const [showGuide, setShowGuide] = useState(false);
            const [hoveredItem, setHoveredItem] = useState(null);
            const [hoverPos, setHoverPos] = useState({ x: 0, y: 0 });
            const [hoverEquipUnitId, setHoverEquipUnitId] = useState(null);
            const [skillBookChoice, setSkillBookChoice] = useState(null);
            const [showLastHeroTip, setShowLastHeroTip] = useState(false);
            const [hasShownLastHeroTip, setHasShownLastHeroTip] = useState(false);
            const [relicTempoStacks, setRelicTempoStacks] = useState(0);
            const [coffeeReward, setCoffeeReward] = useState(false);
            const [returningToStart, setReturningToStart] = useState(false);

            // --- 4-2. Refs: setInterval/비동기 콜백에서 최신 상태를 읽기 위한 참조 ---
            const gridRef = useRef(null);
            const containerRef = useRef(null);
            const unitsRef = useRef(units);
            const enemiesRef = useRef(enemies);
            const holdTimerRef = useRef(null);
            const slowMotionRef = useRef(slowMotion);
            const startPositionsRef = useRef({});
            const droppedGoldRef = useRef([]);
            const isIllusionistDeadRef = useRef(false);
            const hydraDeathsRef = useRef({});
            const perksRef = useRef(perks);
            const inventoryRef = useRef(inventory);
            const inventoryCapacityRef = useRef(MAX_INVENTORY);
            const waveRef = useRef(wave);
            const deadUnitsRef = useRef([]);
            const phaseRef = useRef(phase);
            const subWaveRef = useRef(0);
            const maxSubWavesRef = useRef(1);
            const waveTransitionRef = useRef(false);
            const spawningEnemiesRef = useRef(false);
            const returningToStartRef = useRef(false);
            const startBattlePressRef = useRef(false);
            const lastStartBattleAtRef = useRef(0);
            const tutorialStepRef = useRef(1);
            const tutorialPending3Ref = useRef(false);
            const tutorialPending5Ref = useRef(false);
            const relicTempoStacksRef = useRef(0);
            const talentTreeRef = useRef(talentTree);
            const timeCrystalsRef = useRef(timeCrystals);
            const firstReviveUsedRef = useRef(false);
            const warriorReviveUsedRef = useRef(false);
            useEffect(() => { tutorialStepRef.current = tutorialStep; }, [tutorialStep]);
            useEffect(() => { tutorialPending3Ref.current = tutorialPending3; }, [tutorialPending3]);
            useEffect(() => { tutorialPending5Ref.current = tutorialPending5; }, [tutorialPending5]);
            useEffect(() => { relicTempoStacksRef.current = relicTempoStacks; }, [relicTempoStacks]);
            useEffect(() => { talentTreeRef.current = talentTree; try { localStorage.setItem(TALENT_TREE_STORAGE_KEY, JSON.stringify(talentTree)); } catch(e) {} }, [talentTree]);
            useEffect(() => { timeCrystalsRef.current = timeCrystals; try { localStorage.setItem(TIME_CRYSTAL_STORAGE_KEY, String(timeCrystals)); } catch(e) {} }, [timeCrystals]);
            useEffect(() => { returningToStartRef.current = returningToStart; }, [returningToStart]);
            useEffect(() => {
                if (!returningToStart) return;
                if (phase !== 'placement' && phase !== 'transition') return;
                const sp = startPositionsRef.current || {};
                const allReturned = units.every(u => !sp[u.id] || (u.x === sp[u.id].x && u.y === sp[u.id].y));
                if (!allReturned) return;
                const timer = setTimeout(() => setReturningToStart(false), 430);
                return () => clearTimeout(timer);
            }, [returningToStart, phase, units]);

            useEffect(() => {
                if (!hasShownLastHeroTip && units.length === 1 && deadUnits.length >= 1 && !gameOver) {
                    setShowLastHeroTip(true);
                    setHasShownLastHeroTip(true);
                }
            }, [units.length, deadUnits.length, hasShownLastHeroTip, gameOver]);

            useEffect(() => { unitsRef.current = units; }, [units]);
            useEffect(() => { enemiesRef.current = enemies; }, [enemies]);
            useEffect(() => { slowMotionRef.current = slowMotion; }, [slowMotion]);
            useEffect(() => {
                if (effects.length === 0 && !ultMode && !chainLightningPos && !slowMotion) return;
                let rafId = 0;
                const loop = () => {
                    setAnimationFrameTick(t => (t + 1) % 1000000);
                    rafId = requestAnimationFrame(loop);
                };
                rafId = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(rafId);
            }, [effects.length, ultMode, chainLightningPos, slowMotion]);
            useEffect(() => { startPositionsRef.current = startPositions; }, [startPositions]);
            useEffect(() => { droppedGoldRef.current = droppedGold; }, [droppedGold]);
            useEffect(() => { isIllusionistDeadRef.current = isIllusionistDead; }, [isIllusionistDead]);
            useEffect(() => { hydraDeathsRef.current = hydraDeaths; }, [hydraDeaths]);
            useEffect(() => { perksRef.current = perks; }, [perks]);
            useEffect(() => { inventoryRef.current = inventory; savePermanentLegendaryRelics(inventory); }, [inventory]);
            useEffect(() => { inventoryCapacityRef.current = inventoryCapacity; }, [inventoryCapacity]);
            useEffect(() => { waveRef.current = wave; }, [wave]);
            useEffect(() => { deadUnitsRef.current = deadUnits; }, [deadUnits]);
            useEffect(() => { phaseRef.current = phase; }, [phase]);
            useEffect(() => { subWaveRef.current = subWave; }, [subWave]);
            useEffect(() => { maxSubWavesRef.current = maxSubWaves; }, [maxSubWaves]);

            // 튜토리얼 중에는 현재 단계에 필요한 행동만 허용한다.
            const isTutorialActionAllowed = useCallback((action, payload = {}) => {
                const step = tutorialStepRef.current;
                if (step === 0) return true;
                if (action === 'unitDrag') return step === 1;
                if (action === 'startBattle') return step === 2 || step === 4;
                if (action === 'selectUnit') return step === 3;
                if (action === 'upgradeSkill') return step === 3;
                if (action === 'mageUltimateHold') return step === 4 && payload.unitType === 'mage';
                if (action === 'itemDrag' || action === 'itemSell' || action === 'itemUse' || action === 'equipItem') return step === 5;
                return false;
            }, []);

            const isTutorialLocked = tutorialStep > 0;

            // --- 4-3. Derived stats: 특성/아이템/스킬 효과 계산 ---
            const getPerkEffects = useCallback(() => {
                const effects = { atkMult: 0, hpMult: 0, atkSpeedBonus: 0, critChance: 0, dmgReduce: 0, range: 0, expMult: 0, goldMult: 0, dropBonus: 0, ultCooldownReduce: 0, splashChance: 0, lifeSteal: 0, manaGainMult: 0, moveSpeedBonus: 0, tempoRelic: false, crystalDropBonus: 0, waveHealBonus: 0 };
                const treeEff = getTalentEffects(talentTreeRef.current);
                effects.atkMult += treeEff.atkMult || 0;
                effects.hpMult += treeEff.hpMult || 0;
                effects.goldMult += treeEff.goldMult || 0;
                effects.dropBonus += treeEff.dropBonus || 0;
                effects.expMult += treeEff.expMult || 0;
                effects.crystalDropBonus += treeEff.crystalDropBonus || 0;
                effects.waveHealBonus += treeEff.waveHealBonus || 0;
                perksRef.current.forEach(p => { const perk = PERKS.find(pk => pk.id === p); if (perk) Object.entries(perk.effect).forEach(([k, v]) => { effects[k] = (effects[k] || 0) + v; }); });
                inventoryRef.current.forEach(inv => {
                    if (inv.type !== 'relic') return;
                    const relic = RELIC_ITEMS[inv.itemKey];
                    if (!relic?.effect) return;
                    Object.entries(relic.effect).forEach(([k, v]) => {
                        if (k === 'tempoRelic') effects.tempoRelic = true;
                        else effects[k] = (effects[k] || 0) + v;
                    });
                });
                if (effects.tempoRelic) effects.atkSpeedBonus += Math.min(0.30, relicTempoStacksRef.current * 0.02);
                return effects;
            }, []);

            const getUnitAttackPower = useCallback((unit) => {
                if (!unit) return 0;
                const itemStats = getItemStats(unit.equipment, unit.equipmentBonuses);
                const perkEffects = getPerkEffects();
                const talentEffects = getUnitTalentEffects(talentTreeRef.current, unit.type);
                return Math.max(1, Math.floor((unit.atk + (itemStats.atk || 0)) * (1 + perkEffects.atkMult + (talentEffects.atkMult || 0))));
            }, [getPerkEffects]);

            const grantCombatExp = useCallback((unitId, killedEnemies) => {
                const killedList = Array.isArray(killedEnemies) ? killedEnemies : [];
                const validKillCount = killedList.filter(k => !k.isHydra).length;
                if (!unitId || validKillCount <= 0) return;
                const perkEffects = getPerkEffects();
                const expGain = Math.floor(validKillCount * 25 * (1 + (perkEffects.expMult || 0)));
                if (expGain <= 0) return;
                setUnits(prev => prev.map(unit => {
                    if (unit.id !== unitId) return unit;
                    const newSkillBooks = unit.skillBooks ? JSON.parse(JSON.stringify(unit.skillBooks)) : {};
                    Object.keys(newSkillBooks).forEach(slot => {
                        const book = newSkillBooks[slot];
                        if (book.level < 5) {
                            book.exp = (book.exp || 0) + expGain;
                            while (book.level < 5 && book.exp >= getSkillBookExpNeed(book.level)) {
                                book.exp -= getSkillBookExpNeed(book.level);
                                book.level += 1;
                            }
                        }
                    });
                    let nextExp = unit.exp + expGain;
                    let nextLevel = unit.level;
                    let nextHp = unit.hp;
                    let nextAtk = unit.atk;
                    let nextCurrentHp = unit.currentHp;
                    let nextSkillPoints = unit.skillPoints;
                    while (nextExp >= nextLevel * 40) {
                        nextExp -= nextLevel * 40;
                        nextLevel += 1;
                        nextHp += 15;
                        nextAtk += 8;
                        nextCurrentHp = Math.min(nextCurrentHp + 30, nextHp);
                        if (nextLevel % 2 === 0) nextSkillPoints += 1;
                    }
                    return { ...unit, skillBooks: newSkillBooks, exp: nextExp, level: nextLevel, hp: nextHp, atk: nextAtk, currentHp: nextCurrentHp, skillPoints: nextSkillPoints };
                }));
            }, [getPerkEffects]);

            // --- 4-4. Inventory & reward economy: 상점, 드랍, 합성, 판매 ---
            const generateMerchantItems = useCallback(() => {
                const items = [];
                for (let i = 0; i < 4; i++) {
                    const specialRoll = Math.random();
                    if (specialRoll < 0.015 && waveRef.current >= 25) {
                        const ultraKeys = Object.keys(LEGENDARY_ITEMS).filter(k => LEGENDARY_ITEMS[k].ultra);
                        const key = ultraKeys[Math.floor(Math.random() * ultraKeys.length)];
                        const leg = LEGENDARY_ITEMS[key];
                        items.push({ id: genId(), type: 'legendary', itemKey: key, name: leg.name, icon: leg.icon, desc: leg.desc, stats: leg.stats, price: leg.price || 5200, rarity: leg.rarity });
                    } else if (specialRoll < 0.08) {
                        const legendaryKeys = Object.keys(LEGENDARY_ITEMS).filter(k => !LEGENDARY_ITEMS[k].ultra);
                        const key = legendaryKeys[Math.floor(Math.random() * legendaryKeys.length)];
                        const leg = LEGENDARY_ITEMS[key];
                        items.push({ id: genId(), type: 'legendary', itemKey: key, name: leg.name, icon: leg.icon, desc: leg.desc, stats: leg.stats, price: ITEM_BUY_PRICES[5], rarity: leg.rarity });
                    } else if (specialRoll < 0.20) {
                        const specialKeys = Object.keys(SPECIAL_ITEMS);
                        const key = specialKeys[Math.floor(Math.random() * specialKeys.length)];
                        const special = SPECIAL_ITEMS[key];
                        items.push({ id: genId(), type: 'special', itemKey: key, name: special.name, icon: special.icon, desc: special.desc, price: special.price, rarity: special.rarity });
                    } else {
                        const itemKey = getRandomItem(waveRef.current);
                        const item = itemKey.type === 'legendary' ? LEGENDARY_ITEMS[itemKey.key] : ITEMS[itemKey.key];
                        if (itemKey.type === 'legendary') {
                            items.push({ id: genId(), type: 'legendary', itemKey: itemKey.key, name: item.name, icon: item.icon, desc: item.desc, stats: item.stats, price: item.price || ITEM_BUY_PRICES[5], rarity: item.rarity });
                        } else {
                            items.push({ id: genId(), type: 'normal', itemKey: itemKey.key, name: item.name, icon: item.icon, price: ITEM_BUY_PRICES[item.tier], rarity: item.rarity, stats: item.stats });
                        }
                    }
                }
                return items;
            }, []);

            const tryMergeItems = useCallback((inv) => {
                let workInv = [...inv];
                let workUnits = unitsRef.current.map(u => ({ ...u, equipment: { ...u.equipment }, equipmentBonuses: { ...(u.equipmentBonuses || {}) } }));
                let changedUnits = false;
                const removeSource = (src) => {
                    if (src.source === 'inventory') {
                        workInv = workInv.filter(i => i.id !== src.id);
                    } else if (src.source === 'equipment') {
                        workUnits = workUnits.map(u => {
                            if (u.id !== src.unitId) return u;
                            const removedStats = getItemStats({ [src.slot]: src.itemKey }, { [src.slot]: src.bonusStats || null });
                            const nextHp = Math.max(1, u.hp - (removedStats.hp || 0));
                            changedUnits = true;
                            return { ...u, equipment: { ...u.equipment, [src.slot]: null }, equipmentBonuses: { ...(u.equipmentBonuses || {}), [src.slot]: null }, hp: nextHp, currentHp: Math.min(u.currentHp, nextHp) };
                        });
                    }
                };
                let keepMerging = true;
                while (keepMerging) {
                    keepMerging = false;
                    const counts = {};
                    workInv.forEach(item => {
                        if(item.itemKey && !item.specialKey && item.type !== 'skillBook') {
                            counts[item.itemKey] = (counts[item.itemKey] || []);
                            counts[item.itemKey].push({ source:'inventory', id:item.id, itemKey:item.itemKey, bonusStats:item.bonusStats || null });
                        }
                    });
                    workUnits.forEach(u => {
                        Object.entries(u.equipment || {}).forEach(([slot, itemKey]) => {
                            if (!itemKey) return;
                            counts[itemKey] = (counts[itemKey] || []);
                            counts[itemKey].push({ source:'equipment', unitId:u.id, slot, itemKey, bonusStats:u.equipmentBonuses?.[slot] || null });
                        });
                    });
                    for (const [itemKey, sources] of Object.entries(counts)) {
                        if (sources.length < 3) continue;
                        const item = resolveItemData(itemKey);
                        const transcendKey = TRANSCENDENT_MAP[itemKey];
                        if (transcendKey && item && item.tier >= 5) {
                            sources.slice(0, 3).forEach(removeSource);

            const handleEnemyKill = useCallback((killedEnemy, currentWave) => {
                if (killedEnemy.isIllusionist) { setIsIllusionistDead(true); setGimmickMessage('💀 환술사 처치!'); setTimeout(() => setGimmickMessage(null), 2000); }
                if (killedEnemy.type === 'splitter') {

                    const children = [];
                    const occupied = enemiesRef.current.filter(e => e.id !== killedEnemy.id && e.currentHp > 0);
                    for (const [dx, dy] of offsets) {
                        const nx = killedEnemy.x + dx, ny = killedEnemy.y + dy;

                setUnits(prev => prev.map(u => { const eq = getEquipmentEffects(u.equipment); return eq.killMana ? { ...u, mana: UNIT_TYPES[u.type].maxMana } : u; }));
                if (killedEnemy.isHydra) { setHydraDeaths(hd => ({ ...hd, [killedEnemy.id]: Date.now() })); }
                else {
                    const baseGold = killedEnemy.type === 'boss' ? 80 : killedEnemy.type === 'tank' ? 30 : killedEnemy.isIllusionist ? 40 : killedEnemy.isIllusion ? 20 : 15;
                    const waveBonus = Math.floor(currentWave / 5) * 5;
                    dropGold(killedEnemy.x * CELL + CELL / 2, killedEnemy.y * CELL + CELL / 2, baseGold + waveBonus);
                }
                const enemyType = killedEnemy.isHydra ? 'hydra' : killedEnemy.isIllusionist ? 'illusionist' : killedEnemy.isIllusion ? 'illusion' : killedEnemy.type;
                const perkEffects = getPerkEffects();
                const crystalDropChance = 0.05 + (perkEffects.crystalDropBonus || 0);
                if (!killedEnemy.isHydra && Math.random() < crystalDropChance) {
                    awardTimeCrystals(1, killedEnemy.x * CELL + CELL / 2, killedEnemy.y * CELL + CELL / 2, null);
                }
                const dropRate = (DROP_RATES[enemyType] || 0.2) + perkEffects.dropBonus;
                if (currentWave >= 20 && Math.random() < 0.03) {
                    const bookDrop = createSkillBookDrop();

                    addToInventory(bookDrop);
                    addEffect({ type: 'itemDrop', x: killedEnemy.x * CELL + CELL / 2, y: killedEnemy.y * CELL + CELL / 2, icon: bookMeta.icon, duration: 1100 });
                    setGimmickMessage(`📚 ${bookMeta.name} 획득!`); setTimeout(() => setGimmickMessage(null), 1400);

                    setGimmickMessage('🧰 공간 확장 키트 획득!'); setTimeout(() => setGimmickMessage(null), 1500);

                if (currentWave >= 15) {

                        addEffect({ type: 'itemDrop', x: killedEnemy.x * CELL + CELL / 2, y: killedEnemy.y * CELL + CELL / 2, icon: relic.icon, duration: 1200, relic: true, rarity: relic.rarity });
                        setGimmickMessage(`🏺 전설 유물 획득! ${relic.name}`); setTimeout(() => setGimmickMessage(null), 1700);
                    } else if (relicRoll < 0.013) {
                        const keys = Object.keys(RELIC_ITEMS).filter(k => RELIC_ITEMS[k].rarity === 'rare');
                        const key = keys[Math.floor(Math.random() * keys.length)];
                        const relic = RELIC_ITEMS[key];
                        addToInventory({ type:'relic', key });
                        addEffect({ type: 'itemDrop', x: killedEnemy.x * CELL + CELL / 2, y: killedEnemy.y * CELL + CELL / 2, icon: relic.icon, duration: 1100, relic: true, rarity: relic.rarity });
                        setGimmickMessage(`🏺 희귀 유물 획득! ${relic.name}`); setTimeout(() => setGimmickMessage(null), 1500);
                    }

                if (Math.random() < dropRate) {

            const useSkillBook = useCallback((invItemId) => {

            const useSpecialItem = useCallback((invItemId) => {

                    setEnemies(prev => {

            // --- 4-5. Skill execution: 고유 스킬과 궁극기 처리 ---
            const executeActiveSkill = useCallback((unit) => {
                const skill = ACTIVE_SKILLS[unit.type];
                const currentEnemies = enemiesRef.current.filter(e => e.currentHp > 0);
                if (currentEnemies.length === 0) return false;
                setUnits(prev => prev.map(u => u.id === unit.id ? { ...u, skillFlashUntil: Date.now() + 500 } : u));
                const unitAttackPower = getUnitAttackPower(unit);
                const baseDamage = Math.max(1, Math.floor(unitAttackPower * (skill.damageMultiplier || 1)));
                if (unit.type === 'warrior') {
                    const target = findFarthest(unit, currentEnemies);
                    if (!target) return false;
                    const landCell = getNearestEmptyCell(target.x, target.y, unitsRef.current, enemiesRef.current, unit.id, target.id);
                    const startX = unit.x * CELL + CELL / 2, startY = unit.y * CELL + CELL / 2;
                    const duration = 260;
                    addEffect({ type: 'skillActivate', x: startX, y: startY, color: unit.color, icon: skill.icon, duration: 450 });
                    addEffect({ type: 'jumpShadow', fromX: startX, fromY: startY, toX: landCell.x * CELL + CELL / 2, toY: landCell.y * CELL + CELL / 2, color: unit.color, duration });
                    setUnits(prev => prev.map(u => u.id === unit.id ? { ...u, warriorGuardUntil: Date.now() + skill.guardDuration, jumpAnim: { fromX: unit.x, fromY: unit.y, toX: landCell.x, toY: landCell.y, startTime: Date.now(), duration } } : u));
                    setTimeout(() => {
                        const landingX = landCell.x * CELL + CELL / 2, landingY = landCell.y * CELL + CELL / 2;
                        addEffect({ type: 'slamWave', x: landingX, y: landingY, color: unit.color, duration: 560 });
                        spawnHit(landingX, landingY, unit.color, 1.35);
                        setUnits(prev => prev.map(u => u.id === unit.id ? { ...u, x: landCell.x, y: landCell.y, jumpAnim: null } : u));
                        setEnemies(prev => {
                            const landingUnits = unitsRef.current.map(u => u.id === unit.id ? { ...u, x: landCell.x, y: landCell.y } : u);
                            const updated = prev.map(e => {
                                if (e.currentHp <= 0 || (e.isIllusion && !isIllusionistDeadRef.current)) return e;
                                const onTarget = e.id === target.id || (e.x === target.x && e.y === target.y);
                                const nearLanding = Math.abs(e.x - landCell.x) <= 1 && Math.abs(e.y - landCell.y) <= 1;
                                if (!onTarget && !nearLanding) return e;
                                let extraDamage = 0, newX = e.x, newY = e.y;
                                if (onTarget) { extraDamage += Math.floor(e.hp * skill.impactMaxHpRatio) + Math.floor(unitAttackPower * (skill.impactAtkMultiplier || 0)); const pushed = getPushCell(e, landCell.x, landCell.y, landingUnits, prev); newX = pushed.x; newY = pushed.y; }
                                if (nearLanding) extraDamage += baseDamage;
                                spawnHit(e.x * CELL + CELL / 2, e.y * CELL + CELL / 2, unit.color, onTarget ? 1.1 : 0.75);
                                return { ...e, x: newX, y: newY, currentHp: e.currentHp - extraDamage, stunUntil: Date.now() + skill.stunDuration, hitTime: Date.now() };
                            });
                            const killed = updated.filter(e => e.currentHp <= 0 && prev.find(p => p.id === e.id && p.currentHp > 0));
                            killed.forEach(k => handleEnemyKill(k, waveRef.current));
                            grantCombatExp(unit.id, killed);
                            return updated.filter(e => e.currentHp > 0 || e.isHydra);
                        });
                    }, duration);
                } else if (unit.type === 'ranger') {
                    const ux = unit.x * CELL + CELL / 2, uy = unit.y * CELL + CELL / 2;
                    addEffect({ type: 'skillActivate', x: ux, y: uy, color: unit.color, icon: skill.icon, duration: 500 });
                    const occupied = [...unitsRef.current.filter(u => u.id !== unit.id), ...enemiesRef.current.filter(e => e.currentHp > 0)];
                    const isFreeCell = (x, y) => x >= 0 && x < GRID_W && y >= 0 && y < GRID_H && !occupied.some(o => o.x === x && o.y === y);
                    const backCell = { x: unit.x, y: unit.y + 1 };
                    let retreatCell = isFreeCell(backCell.x, backCell.y) ? backCell : null;
                    if (!retreatCell) {
                        const sideCandidates = [{ x: unit.x - 1, y: unit.y }, { x: unit.x + 1, y: unit.y }].filter(c => isFreeCell(c.x, c.y));
                        if (sideCandidates.length > 0) {
                            retreatCell = sideCandidates.reduce((best, c) => {
                                const cScore = currentEnemies.length ? Math.min(...currentEnemies.map(e => Math.abs(c.x - e.x) + Math.abs(c.y - e.y))) : 0;
                                const bScore = currentEnemies.length ? Math.min(...currentEnemies.map(e => Math.abs(best.x - e.x) + Math.abs(best.y - e.y))) : 0;
                                return cScore > bScore ? c : best;
                            });
                        }
                    }
                    if (retreatCell && (retreatCell.x !== unit.x || retreatCell.y !== unit.y)) { setUnits(prev => prev.map(u => u.id === unit.id ? { ...u, x: retreatCell.x, y: retreatCell.y } : u)); }
                    const targets = [...currentEnemies].sort((a, b) => dist(unit, a) - dist(unit, b)).slice(0, skill.targetCount);
                    targets.forEach((target, i) => {
                        setTimeout(() => {
                            const shootX = retreatCell ? retreatCell.x : unit.x, shootY = retreatCell ? retreatCell.y : unit.y;
                            const fromX = shootX * CELL + CELL / 2, fromY = shootY * CELL + CELL / 2;
                            const tx = target.x * CELL + CELL / 2, ty = target.y * CELL + CELL / 2;
                            addEffect({ type: 'projectile', fromX, fromY, toX: tx, toY: ty, color: '#fbbf24', unitType: 'ranger', duration: 150 });
                            setTimeout(() => {
                                spawnHit(tx, ty, '#22c55e', 1.2);
                                setEnemies(prev => {
                                    const updated = prev.map(e => {
                                        if (e.id === target.id && !(e.isIllusion && !isIllusionistDeadRef.current)) { return { ...e, currentHp: e.currentHp - baseDamage, hitTime: Date.now() }; }
                                        return e;
                                    });
                                    const killed = updated.filter(e => e.currentHp <= 0 && prev.find(p => p.id === e.id && p.currentHp > 0));
                                    killed.forEach(k => handleEnemyKill(k, waveRef.current));
                                    grantCombatExp(unit.id, killed);
                                    return updated.filter(e => e.currentHp > 0 || e.isHydra);
                                });
                            }, 150);
                        }, i * 100);
                    });
                } else if (unit.type === 'mage') {
                    const ux = unit.x * CELL + CELL / 2, uy = unit.y * CELL + CELL / 2;
                    addEffect({ type: 'skillActivate', x: ux, y: uy, color: unit.color, icon: skill.icon, duration: 500 });

            // --- 4-6. Combat resolution: 투사체, 피해, 상태이상, 처치 보상 ---

 position:'absolute', top:1, left:2, fontSize:8, color:'#93c5fd', textShadow:'0 1px 2px #000' }}>💨</span>}<span style={{ position:'relative', zIndex:2, filter: isRelic ? `drop-shadow(0 0 6px ${relicColor})` : isShinyLegendary ? 'drop-shadow(0 0 5px #facc15)' : 'none' }}>{item?.icon || '❔'}</span></div>;
                            })}
                        </div>
                    </div>
                    {(phase === 'placement' || phase === 'transition') && !gameOver && !perkSelection && !merchant && <div style={{ marginTop: 12, display:'flex', flexDirection:'column', gap:8, alignItems:'center', justifyContent:'center' }}>
                        <div style={{ display:'flex', gap:8, alignItems:'center', justifyContent:'center' }}>
                            <button onClick={() => { if (!isTutorialLocked) setShowTalentTree(true); }} disabled={isTutorialLocked} style={{ padding: '10px 16px', fontSize: 13, background: 'linear-gradient(135deg, #2563eb, #7c3aed)', color: '#fff', border: 'none', borderRadius: 8, cursor: isTutorialLocked ? 'not-allowed' : 'pointer', opacity: isTutorialLocked ? 0.35 : 1, fontWeight:'bold', boxShadow:'0 0 14px rgba(59,130,246,0.35)' }}>🌌 특성 트리</button>
                            <button onPointerDown={(e) => { startBattlePressRef.current = e.isTrusted && !battleStartLocked; }} onPointerLeave={() => { startBattlePressRef.current = false; }} onClick={startBattle} disabled={battleStartLocked} style={{ padding: '10px 28px', fontSize: 14, background: returningToStart ? '#6b7280' : '#ef4444', color: '#fff', border: 'none', borderRadius: 8, cursor: battleStartLocked ? 'not-allowed' : 'pointer', opacity: battleStartLocked ? 0.38 : 1, animation: (!returningToStart && (tutorialStep === 2 || tutorialStep === 4)) ? 'tutGlowRed 0.9s ease-in-out infinite' : 'none' }}>{returningToStart ? '↩️ 복귀 중...' : '⚔️ 전투 시작!'}</button>
                            <button onClick={() => { if (!isTutorialLocked) setShowGuide(true); }} disabled={isTutorialLocked} title="게임 설명서" style={{ width: 34, height: 34, fontSize: 16, background: 'rgba(255,255,255,0.12)', color:'#fff', border:'1px solid rgba(255,255,255,0.25)', borderRadius: 8, cursor: isTutorialLocked ? 'not-allowed' : 'pointer', opacity: isTutorialLocked ? 0.35 : 1 }}>?</button>
                        </div>
                        {showLastHeroTip && <div style={{ position:'relative', maxWidth:360, background:'rgba(17,24,39,0.94)', border:'1px solid rgba(251,191,36,0.65)', color:'#fef3c7', borderRadius:10, padding:'8px 28px 8px 12px', fontSize:10, lineHeight:1.45, boxShadow:'0 0 18px rgba(251,191,36,0.18)' }}>
                            다음 상점까지 살아남아서, 부활깃털을 얻어 동료를 부활시키세요!
                            <button onClick={() => setShowLastHeroTip(false)} style={{ position:'absolute', top:4, right:6, width:18, height:18, border:'none', borderRadius:9, background:'rgba(255,255,255,0.12)', color:'#fff', cursor:'pointer', fontSize:10, lineHeight:'18px', padding:0 }}>×</button>
                        </div>}
                    </div>}
                    <TutorialOverlay step={tutorialStep} movedCount={tutorialMovedUnitIds.length} totalUnits={Math.min(3, units.length)} />
                    {skillBookChoice && (() => {
                        const skill = SKILLBOOK_BY_ID[skillBookChoice.skillId];
                        const bookMeta = SKILLBOOK_TYPES[skillBookChoice.unitType];
                        const targetUnits = units.filter(u => u.type === skillBookChoice.unitType);
                        return <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.9)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:3300 }}>
                            <div style={{ width:'min(560px, 94vw)', background:'#111827', border:`2px solid ${bookMeta.color}`, borderRadius:16, padding:22, color:'#fff', boxShadow:`0 0 40px ${bookMeta.color}55` }}>
                                <div style={{ fontSize:18, fontWeight:'bold', marginBottom:6 }}>{bookMeta.icon} {bookMeta.name} 개봉</div>
                                <div style={{ background:'rgba(255,255,255,0.08)', borderRadius:12, padding:14, marginBottom:14 }}>
                                    <div style={{ fontSize:28, marginBottom:4 }}>{skill.icon}</div>
                                    <div style={{ fontSize:16, fontWeight:'bold', color:'#facc15' }}>{skill.name}</div>
                                    <div style={{ fontSize:11, color:'#d1d5db', lineHeight:1.55, marginTop:6 }}>{skill.desc}</div>
                                    <div style={{ fontSize:10, color:'#c4b5fd', marginTop:8 }}>스킬북 스킬은 전투 경험치로 Lv.5까지 자동 성장합니다.</div>
                                </div>
                                <div style={{ fontSize:12, color:'#aaa', marginBottom:8 }}>교체할 기존 스킬을 선택하세요.</div>
                                {targetUnits.map(u => <div key={u.id} style={{ marginBottom:10, background:'rgba(0,0,0,0.25)', borderRadius:10, padding:10 }}>
                                    <div style={{ fontWeight:'bold', color:u.color, marginBottom:6 }}>{u.emoji} {u.name}</div>
                                    <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>{[0,1,2].map(i => {
                                        const oldSkill = getDisplayedSkill(u, i);
                                        return <button key={i} onClick={() => replaceSkillWithBook(u.id, i)} style={{ flex:'1 1 150px', padding:10, background:'#1f2937', color:'#fff', border:'1px solid #4b5563', borderRadius:8, cursor:'pointer', textAlign:'left' }}>
                                            <div style={{ fontSize:12, fontWeight:'bold' }}>{oldSkill.icon} {oldSkill.name}</div>
                                            <div style={{ fontSize:9, color:'#9ca3af' }}>이 스킬을 교체</div>
                                        </button>;
                                    })}</div>
                                </div>)}
                                <button onClick={discardRevealedSkillBook} style={{ width:'100%', padding:'9px 12px', background:'#7f1d1d', color:'#fff', border:'none', borderRadius:8, cursor:'pointer', marginTop:6 }}>마음에 들지 않음 — 버리기</button>
                            </div>
                        </div>;
                    })()}

                    <GuideModal open={showGuide} onClose={() => setShowGuide(false)} />
                    <TalentTreeModal open={showTalentTree} onClose={() => setShowTalentTree(false)} tree={talentTree} crystals={timeCrystals} onBuy={buyTalentNode} purchasedNodeId={lastPurchasedTalent} />
                    {coffeeReward && <div style={{ position:'fixed', inset:0, zIndex:4200, pointerEvents:'none', background:'radial-gradient(circle, rgba(251,191,36,0.16), rgba(0,0,0,0.28) 42%, rgba(0,0,0,0.0) 72%)' }}>
                        <div style={{ position:'absolute', left:'50%', top:'50%', width:260, height:260, borderRadius:'50%', background:'conic-gradient(from 0deg, rgba(250,204,21,0), rgba(250,204,21,0.45), rgba(255,255,255,0.55), rgba(250,204,21,0.1), rgba(250,204,21,0))', animation:'coffeeRay 1.15s linear infinite' }} />
                        <div style={{ position:'absolute', left:'50%', top:'50%', minWidth:310, padding:'24px 28px', borderRadius:22, textAlign:'center', color:'#fff', background:'linear-gradient(145deg, rgba(59,32,6,0.96), rgba(17,24,39,0.97), rgba(92,47,5,0.96))', border:'3px solid #facc15', boxShadow:'0 0 46px rgba(250,204,21,0.95), inset 0 0 22px rgba(255,255,255,0.16)', animation:'coffeeBurst 3.2s ease-out both' }}>
                            <div style={{ fontSize:46, marginBottom:8, filter:'drop-shadow(0 0 12px #facc15)' }}>☕</div>
                            <div style={{ fontSize:22, fontWeight:'900', color:'#fef3c7', textShadow:'0 0 16px rgba(250,204,21,0.9)' }}>커피를 획득하였습니다</div>
                            <div style={{ marginTop:8, fontSize:11, color:'#fde68a', letterSpacing:1.4 }}>STAGE 40 CLEAR REWARD</div>
                        </div>
                    </div>}
                    {perkSelection && <div style={{ position: 'fixed', inset: 0, background: 'radial-gradient(circle at center, rgba(25,25,45,0.96), rgba(0,0,0,0.94))', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 3000 }}>
                        <style>{`@keyframes perkLegendIn { 0% { opacity:0; transform: translateY(22px) scale(0.7) rotate(-4deg); filter:brightness(0.5); } 45% { opacity:1; transform: translateY(-8px) scale(1.08) rotate(2deg); filter:brightness(1.8); } 100% { opacity:1; transform: translateY(0) scale(1) rotate(0deg); filter:brightness(1); } } @keyframes perkLegendAura { 0%,100% { box-shadow:0 0 16px rgba(245,158,11,0.55), inset 0 0 16px rgba(245,158,11,0.15); } 50% { box-shadow:0 0 38px rgba(245,158,11,0.95), inset 0 0 26px rgba(245,158,11,0.32); } } @keyframes perkRareAura { 0%,100% { box-shadow:0 0 10px rgba(59,130,246,0.45); } 50% { box-shadow:0 0 22px rgba(59,130,246,0.8); } } @keyframes perkCardDealIn { 0% { opacity:0; transform:translateY(20px) scale(0.76); filter:brightness(0.55) blur(2px); } 58% { opacity:1; transform:translateY(-5px) scale(1.05); filter:brightness(1.35) blur(0); } 100% { opacity:1; transform:translateY(0) scale(1); filter:brightness(1) blur(0); } }`}</style>
                        <div style={{ color: '#fff', fontSize: 20, marginBottom: 8, fontWeight:'bold' }}>🎁 특성 선택</div>
                        <div style={{ color:'#9ca3af', fontSize:11, marginBottom:16 }}>전설 특성 등장 확률 3% · 리롤할 때마다 비용 +500G</div>
                        <div style={{ display: 'flex', gap: 14, flexWrap:'wrap', justifyContent:'center' }}>{perkSelection.map((perk, idx) => { const meta = PERK_RARITY_META[perk.rarity] || PERK_RARITY_META.common; const isLegend = perk.rarity === 'legendary'; const isRare = perk.rarity === 'rare'; return (
                            <div key={`${perk.id}-${perkRerollCost}`} onClick={() => selectPerk(perk.id)} style={{ width: 150, minHeight: 172, background: isLegend ? 'linear-gradient(145deg, #2a1600, #111827 60%, #3b2202)' : isRare ? 'linear-gradient(145deg, #071a3a, #111827)' : '#222', borderRadius: 14, padding: 16, cursor: 'pointer', border: `2px solid ${meta.color}`, textAlign: 'center', position:'relative', overflow:'hidden', animation: isLegend ? `perkLegendIn 0.72s ease-out ${idx * 0.22}s both, perkLegendAura 1.15s ease-in-out ${idx * 0.22 + 0.72}s infinite` : isRare ? `perkCardDealIn 0.42s ease-out ${idx * 0.16}s both, perkRareAura 1.4s ease-in-out ${idx * 0.16 + 0.42}s infinite` : `perkCardDealIn 0.36s ease-out ${idx * 0.16}s both`, boxShadow: `0 0 14px ${meta.glow}` }}>
                                {isLegend && <div style={{ position:'absolute', inset:-30, background:'radial-gradient(circle, rgba(251,191,36,0.22), transparent 62%)', animation:'pulse 0.8s infinite', pointerEvents:'none' }} />}
                                <div style={{ position:'relative', fontSize: 34, marginBottom:6 }}>{perk.icon}</div>
                                <div style={{ position:'relative', color: meta.color, fontSize: 10, fontWeight:'bold', letterSpacing:1.2, marginBottom:4 }}>{meta.name}</div>
                                <div style={{ position:'relative', color: '#fff', fontSize: 13, fontWeight: 'bold', marginBottom:7 }}>{perk.name}</div>
                                <div style={{ position:'relative', color: '#cbd5e1', fontSize: 10, lineHeight:1.45 }}>{perk.desc}</div>
                            </div>
                        ); })}</div>
                        <div style={{ display:'flex', gap:10, marginTop:18, alignItems:'center' }}>
                            <button onClick={rerollPerkSelection} style={{ padding:'9px 18px', background: gold >= perkRerollCost ? '#8b5cf6' : '#444', color:'#fff', border:'none', borderRadius:8, cursor: gold >= perkRerollCost ? 'pointer' : 'not-allowed', fontSize:12, fontWeight:'bold' }}>🔄 리롤 ({perkRerollCost}G)</button>
                            <div style={{ color:'#facc15', fontSize:12, fontWeight:'bold' }}>보유 골드 {gold}G</div>
                        </div>
                    </div>}
                    {merchant && <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.92)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 3000 }}>
                        <div style={{ background: '#111', borderRadius: 16, padding: 24, maxWidth: 600, width: '95%', maxHeight: '90vh', overflowY: 'auto' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                                <div style={{ color: '#fff', fontSize: 20, fontWeight: 'bold' }}>🏪 상인</div>
                                <div style={{ color: '#facc15', fontSize: 14, fontWeight: 'bold' }}>💰 {gold}G</div>
                            </div>
                            <div style={{ color: '#aaa', fontSize: 11, marginBottom: 10 }}>구매</div>
                            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 16 }}>{merchant.items.map((item, idx) => {
                                const fullItem = resolveItemData(item.itemKey) || item;

                                return <div key={item.id} onClick={() => buyFromMerchant(item)}
                                    onMouseEnter={(e) => { setHoveredItem({ ...item, merchantItem: true }); setHoverPos({ x: e.clientX, y: e.clientY }); }} onMouseLeave={() => setHoveredItem(null)}

                                    <div style={{ fontSize: 32 }}>{item.icon}</div>
                                    <div style={{ color: '#fff', fontSize: 10, marginBottom: 4 }}>{item.name}</div>
                                    <div style={{ color: gold >= item.price ? '#facc15' : '#ef4444', fontSize: 11, fontWeight: 'bold' }}>{item.price}G</div>

                            })}</div>

                                <button onClick={rerollMerchant} style={{ padding: '8px 18px', background: '#8b5cf6', color: '#fff', border: 'none', borderRadius: 8, cursor: 'pointer', fontSize: 12 }}>🔄 리롤 (300G)</button>
                                <button onClick={closeMerchant} style={{ padding: '8px 18px', background: '#22c55e', color: '#fff', border: 'none', borderRadius: 8, cursor: 'pointer', fontSize: 12 }}>닫기</button>
                            </div>
                            <div style={{ borderTop: '1px solid #333', paddingTop: 14 }}>
                                <div style={{ color: '#aaa', fontSize: 11, marginBottom: 10 }}>📦 내 인벤토리 (클릭하여 판매)</div>
                                {inventory.length === 0 && <div style={{ color: '#555', fontSize: 11 }}>아이템 없음</div>}
                                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>{inventory.map(invItem => {
                                    const it = resolveInventoryItemData(invItem);
                                    if (!it) return null;
                                    const perkEff = getPerkEffects();
                                    const isSpecial = invItem.specialKey || invItem.isSpecialEquip;
                                    const price = isSpecial ? Math.floor((it.price || 500) * 0.5) : Math.floor((ITEM_SELL_PRICES[it.tier || 1] || ITEM_SELL_PRICES[5]) * (1 + perkEff.goldMult));
                                    return <div key={invItem.id} onClick={() => sellItem(invItem.id)} style={{ width: 72, background: '#1a1a2e', borderRadius: 8, padding: '8px 4px', border: `2px solid ${RARITY_COLORS[it.rarity] || '#888'}`, textAlign: 'center', cursor: 'pointer' }}
                                        onMouseEnter={(e) => { setHoveredItem(invItem); setHoverPos({ x: e.clientX, y: e.clientY }); }} onMouseLeave={() => setHoveredItem(null)}>
                                        <div style={{ fontSize: 22 }}>{it.icon}</div>
                                        <div style={{ color: '#22c55e', fontSize: 10, fontWeight: 'bold' }}>+{price}G</div>
                                    </div>;
                                })}</div>
                            </div>
                        </div>
                    </div>}
                    {draggingItem && <div style={{ position: 'absolute', left: itemDragPos.x - 18, top: itemDragPos.y - 18, width: 36, height: 36, background: 'rgba(255,255,255,0.6)', borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22, pointerEvents: 'none', zIndex: 1000 }}>{resolveInventoryItemData(draggingItem)?.icon}</div>}
                    {mergeEffect && <div style={{ position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', background: 'rgba(0,0,0,0.9)', padding: 20, borderRadius: 12, zIndex: 2000, color: '#fff' }}>🔮 합성! {resolveItemData(mergeEffect.toItem)?.icon} {resolveItemData(mergeEffect.toItem)?.name}</div>}
                    {hoveredItem && (() => {
                        const hi = hoveredItem;
                        const it = resolveInventoryItemData(hi);
                        if (!it) return null;
                        const statLabels = { atk:'공격력', hp:'체력', dmgReduce:'피해감소', atkSpeedBonus:'공속', dmgBonus:'피해증폭', range:'사거리', critChance:'치명타', counterChance:'반격확률', explosionChance:'폭발확률', moveSpeedBonus:'이동속도', manaGainMult:'마나 획득', lifeSteal:'흡혈', goldMult:'골드 획득', dropBonus:'드롭률' };
                        return <div style={{ position:'fixed', left: Math.min(hoverPos.x + 12, window.innerWidth - 180), top: Math.max(8, hoverPos.y - 130), background:'rgba(8,8,24,0.97)', border:`2px solid ${RARITY_COLORS[it.rarity] || '#888'}`, borderRadius:10, padding:'10px 13px', zIndex:6000, color:'#fff', pointerEvents:'none', minWidth:180, maxWidth:240 }}>
                            <div style={{ fontWeight:'bold', fontSize:13, marginBottom:3 }}>{it.icon} {it.name}</div>
                            <div style={{ fontSize:9, color: RARITY_COLORS[it.rarity] || '#888', marginBottom:6, textTransform:'uppercase', letterSpacing:1 }}>{it.rarity}</div>
                            {it.stats && Object.entries(it.stats).filter(([,v]) => v).map(([k, v]) => <div key={k} style={{ fontSize:10, color:'#ddd', marginBottom:1 }}>+{typeof v === 'number' && v <= 1 && v > 0 ? `${Math.round(v*100)}%` : v} {statLabels[k] || k}</div>)}
                            {it.type === 'relic' && it.effect && Object.entries(it.effect).filter(([k]) => k !== 'tempoRelic').map(([k, v]) => <div key={k} style={{ fontSize:10, color:'#dbeafe', marginBottom:1 }}>+{typeof v === 'number' && v <= 1 && v > 0 ? `${Math.round(v*100)}%` : v} {statLabels[k] || k}</div>)}
                            {it.effect?.tempoRelic && <div style={{ fontSize:10, color:'#facc15', marginBottom:2 }}>공격할수록 공속 추가 증가: 최대 +30%</div>}
                            {hi.bonusStats?.moveSpeedBonus && <div style={{ fontSize:10, color:'#93c5fd', marginBottom:4 }}>추가 옵션: 이동속도 +{Math.round(hi.bonusStats.moveSpeedBonus * 100)}%</div>}
                            {hi.price && <div style={{ fontSize:10, color:'#facc15', marginBottom:4 }}>상점가 {hi.price}G</div>}
                            {getItemEffects(it).length > 0 && <div style={{ fontSize:9, color:'#c4b5fd', marginBottom:4 }}>효과: {getItemEffects(it).join(' / ')}</div>}
                            {it.desc && <div style={{ fontSize:9, color:'#aaa', marginTop:5, borderTop:'1px solid #333', paddingTop:5, lineHeight:1.45 }}>{it.desc}</div>}
                        </div>;
                    })()}
                </div>
            );
        }

        /* =========================================================
           5. APP BOOTSTRAP
        ========================================================= */
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GridDefenseGame />);
    </script>
